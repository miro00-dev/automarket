<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request a password recovery link for your AutoMarket account." />
    <title>AutoMarket | Forgot Password</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="auth-page" id="main-content">
      <section class="auth-section">
        <div class="container">
          <div class="auth-card mx-auto">
            <div class="auth-card-heading text-center">
              <span class="auth-icon"><i class="bi bi-envelope-arrow-up" aria-hidden="true"></i></span>
              <span class="section-kicker">Account recovery</span>
              <h1 class="display-6 fw-bold mb-2">Forgot your password?</h1>
              <p class="text-secondary mb-0">Enter your account email and we will send you a secure recovery link.</p>
            </div>
            <div class="alert alert-danger auth-message d-none" id="forgot-password-error" role="alert" tabindex="-1"></div>
            <div class="alert alert-success auth-message d-none" id="forgot-password-success" role="status" tabindex="-1"></div>
            <form id="forgot-password-form" novalidate>
              <div class="mb-4">
                <label class="form-label" for="forgot-password-email">Email address</label>
                <input class="form-control" id="forgot-password-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">
                <span class="spinner-border spinner-border-sm me-2 d-none" data-auth-spinner aria-hidden="true"></span>
                <i class="bi bi-send me-2" data-auth-icon aria-hidden="true"></i>
                <span data-auth-label>Send Reset Link</span>
              </button>
            </form>
            <p class="auth-switch text-center mb-0"><a href="/pages/login.html"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to Login</a></p>
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
