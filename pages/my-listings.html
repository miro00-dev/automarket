<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage your AutoMarket vehicle listings." />
    <title>AutoMarket | My Listings</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="browse-page" id="main-content">
      <section class="page-hero"><div class="container position-relative">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb mb-3"><li class="breadcrumb-item"><a href="/">Home</a></li><li class="breadcrumb-item active" aria-current="page">My Listings</li></ol></nav>
        <span class="eyebrow text-uppercase">Your garage</span><h1 class="display-3 fw-bold mt-2 mb-3">My Listings</h1>
        <p class="page-hero-copy mb-0">Review, edit, or remove the vehicles published from your account.</p>
      </div></section>
      <section class="browse-content"><div class="container">
        <div class="results-toolbar d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
          <div><span class="section-kicker mb-1">Account inventory</span><h2 class="h4 mb-0">Your vehicles</h2></div>
          <a class="btn btn-primary" href="/pages/add-car.html"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Add another car</a>
        </div>
        <div class="alert alert-danger d-none" id="my-listings-error" role="alert" tabindex="-1"></div>
        <div class="loading-state text-center" id="my-listings-loading" role="status"><span class="spinner-border text-primary" aria-hidden="true"></span><p class="mt-3 mb-0">Loading your listings...</p></div>
        <div class="row g-4 d-none" id="my-listings-results"></div>
        <div class="empty-results text-center d-none" id="my-listings-empty" role="status">
          <i class="bi bi-car-front" aria-hidden="true"></i><h2 class="h4 mt-3">You have no listings yet</h2>
          <p class="text-secondary mb-3">Publish your first vehicle to make it available in AutoMarket.</p><a class="btn btn-primary" href="/pages/add-car.html">Sell Your Car</a>
        </div>
      </div></section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
