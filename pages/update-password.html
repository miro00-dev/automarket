<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a new password for your AutoMarket account." />
    <title>AutoMarket | Set New Password</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="auth-page" id="main-content">
      <section class="auth-section">
        <div class="container">
          <div class="auth-card mx-auto">
            <div class="auth-card-heading text-center">
              <span class="auth-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
              <span class="section-kicker">Secure your account</span>
              <h1 class="display-6 fw-bold mb-2">Set a new password</h1>
              <p class="text-secondary mb-0">Choose a new password with at least 6 characters.</p>
            </div>
            <div class="alert alert-info auth-message" id="recovery-checking" role="status">
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Verifying your recovery link...
            </div>
            <div class="alert alert-danger auth-message d-none" id="update-password-error" role="alert" tabindex="-1"></div>
            <div class="alert alert-success auth-message d-none" id="update-password-success" role="status" tabindex="-1">
              Your password was updated successfully. <a class="alert-link" href="/pages/login.html">Continue to Login</a>.
            </div>
            <form id="update-password-form" novalidate>
              <div class="mb-4">
                <label class="form-label" for="new-password">New password</label>
                <input class="form-control" id="new-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required />
                <div class="invalid-feedback">Use at least 6 characters.</div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="new-password-confirmation">Confirm new password</label>
                <input class="form-control" id="new-password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" placeholder="Enter the password again" minlength="6" required />
                <div class="invalid-feedback" id="new-password-confirmation-error">Confirm your new password.</div>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit" disabled>
                <span class="spinner-border spinner-border-sm me-2 d-none" data-auth-spinner aria-hidden="true"></span>
                <i class="bi bi-key me-2" data-auth-icon aria-hidden="true"></i>
                <span data-auth-label>Set New Password</span>
              </button>
            </form>
            <p class="auth-switch text-center mb-0">Need another link? <a href="/pages/forgot-password.html">Request password recovery</a></p>
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
