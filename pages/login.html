<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your AutoMarket account." />
    <title>AutoMarket | Login</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="auth-page" id="main-content">
      <section class="auth-section">
        <div class="container">
          <div class="auth-card mx-auto">
            <div class="auth-card-heading text-center">
              <span class="auth-icon"><i class="bi bi-person" aria-hidden="true"></i></span>
              <span class="section-kicker">Welcome back</span>
              <h1 class="display-6 fw-bold mb-2">Login</h1>
              <p class="text-secondary mb-0">Access your AutoMarket account with your email and password.</p>
            </div>
            <div class="alert alert-danger auth-message d-none" id="login-error" role="alert" tabindex="-1"></div>
            <div class="alert alert-success auth-message d-none" id="login-success" role="status" tabindex="-1">Login successful. Taking you to AutoMarket...</div>
            <form id="login-form" novalidate>
              <div class="mb-4">
                <label class="form-label" for="login-email">Email address</label>
                <input class="form-control" id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="login-password">Password</label>
                <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required />
                <div class="invalid-feedback">Enter your password.</div>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">
                <span class="spinner-border spinner-border-sm me-2 d-none" data-auth-spinner aria-hidden="true"></span>
                <i class="bi bi-box-arrow-in-right me-2" data-auth-icon aria-hidden="true"></i>
                <span data-auth-label>Login</span>
              </button>
            </form>
            <p class="auth-switch text-center mb-0">Don't have an account? <a href="/pages/register.html">Create one</a></p>
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
